# ============================================================
# 打包前自定义：改掉 App 的名字和图标
# ============================================================
#
# 这个文件是给你改的。改完直接 bash build.sh，打出来的
# APK 桌面名字和图标就是你写的这个。
#
# 每一项前面有 # 就是「没改，用默认」。
# 想改哪项，把 # 去掉，写成你自己的。
#
# ------------------------------------------------------------
# ① 桌面名字（手机上叫啥）
# ------------------------------------------------------------
# 留空或注释掉 = 用默认的「吃白饭的大肥鱼」
#
# appName=我的小鲸
#
# ------------------------------------------------------------
# ② 桌面图标（手机上那张图）
# ------------------------------------------------------------
# 留空或注释掉 = 用默认图标
# 填相对路径，指向一张图。最好是 512x512 的 PNG，方图。
# 不是方图会自动居中裁成方的。
#
# appIcon=my-icon.png
#
# ------------------------------------------------------------
# ③ 包名（进阶，一般别动）
# ------------------------------------------------------------
# 动了包名等于换一个 App，旧的装不上会被当成两个。
# 除非你想同时装两个，否则不要改。
#
# packageName=com.xiaoman.app
#
# ------------------------------------------------------------
# ④ App 里面顶栏显示的名字
# ------------------------------------------------------------
# 不填就跟 appName 一样
#
# inAppName=小鲸
